name: EDP Serial host contracts
on:
  push:
    branches: [main, feature/logging-v1]
  pull_request:

jobs:
  serial-host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run endpoint contracts
        env:
          CXX: ${{ matrix.cxx }}
        run: bash tests/run_host_tests.sh
